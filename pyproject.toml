[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypatia-hoard"
version = "0.1.0"
description = "The user's own flashcards with spaced repetition (SM-2), filled by the assistant from what the user reads, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hypatia-hoard = "hypatia.__main__:main"

[tool.setuptools.packages.find]
include = ["hypatia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
