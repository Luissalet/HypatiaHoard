[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypatia-hoard"
version = "2.0.0"
description = "Exam Coach's local server: the study bank synced with the PWA, spaced repetition, quizzes and mock exams, and a notebook of your own sources with citations, exposed to assistants through MCP."
readme = "HOARD.md"
requires-python = ">=3.11"
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "pypdf>=4",
  "cryptography>=42",  # AES-GCM for password-protected subject packages
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]  # reportlab: test fixtures only (PDF generation)

[project.scripts]
hypatia-hoard = "hypatia.__main__:main"

[tool.setuptools.packages.find]
include = ["hypatia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
